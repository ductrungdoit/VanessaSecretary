name: Publish add-on image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - package.json
      - package-lock.json
      - server.js
      - src/**
      - index.html
      - vite.config.js
      - vanessa_secretary/config.yaml
      - .github/workflows/publish-addon-image.yml

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      addon: ${{ steps.version.outputs.addon }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: version
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' vanessa_secretary/config.yaml)
          previous=$(git show HEAD^:vanessa_secretary/config.yaml | sed -n 's/^version: "\(.*\)"/\1/p')
          test -n "$version"
          test "$version" != "$previous"
          echo "addon=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/ductrungdoit/vanessa-secretary-${{ matrix.arch }}:${{ needs.version.outputs.addon }}
            ghcr.io/ductrungdoit/vanessa-secretary-${{ matrix.arch }}:latest
