name: Publish add-on image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - package.json
      - package-lock.json
      - server.js
      - src/**
      - index.html
      - vite.config.js
      - vanessa_secretary/config.yaml
      - .github/workflows/publish-addon-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/ductrungdoit/vanessa-secretary-${{ matrix.arch }}:1.0.0
            ghcr.io/ductrungdoit/vanessa-secretary-${{ matrix.arch }}:latest
